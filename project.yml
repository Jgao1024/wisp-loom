name: Orbit
options:
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans]
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
packages:
  OrbitKit:
    path: Packages/OrbitKit
targets:
  Orbit:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: OrbitKit
        products: [ShellCore, ShellUI, ShellPlatform]
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHighResolutionCapable: true
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.orbit
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
