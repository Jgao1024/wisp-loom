name: WispLoom
options:
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans]
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
packages:
  WispLoomKit:
    path: Packages/WispLoomKit
targets:
  WispLoom:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: WispLoomKit
        products: [ShellCore, ShellUI, ShellPlatform, AppRuntime]
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHighResolutionCapable: true
        LSUIElement: true
        CFBundleDisplayName: Wisp Loom
    preBuildScripts:
      - name: Copy apps
        script: |
          # Built-in apps come from `make apps`; the bundle gets whatever build/apps holds.
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Apps"
          if [ -d "$SRCROOT/build/apps" ]; then
            rsync -a --delete "$SRCROOT/build/apps/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Apps/"
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.example.wisploom
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
